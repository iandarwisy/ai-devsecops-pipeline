repos:
  # 1. Check file and private keys (SSH/PEM)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # 2. SAST Python (OWASP A02, A03, A05)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: Bandit Python SAST (Medium/High)
        args: ["-ll", "-r", "app/", "-x", "app/test_app.py"]
        pass_filenames: false

  # 3. Detect Secret & API Key (OWASP A02)
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Scanner
        entry: gitleaks protect --staged --redact --verbose
        language: system
        pass_filenames: false
