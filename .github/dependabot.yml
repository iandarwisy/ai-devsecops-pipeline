version: 2
updates:
  # 1. monitor library Python (OWASP A06)
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "security"

  # 2. monitor basic image of Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # 3. monitor version of GitHub Actions workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
